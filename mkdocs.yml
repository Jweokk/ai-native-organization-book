site_name: AI 原生组织
site_description: AI-Native Organization — 免费公开、持续更新的开源书籍
site_url: https://aiorg.fly2ai.top
docs_dir: book
site_dir: site
repo_url: https://github.com/Jweokk/ai-native-organization-book
repo_name: GitHub

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - footnotes
  - attr_list

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Jweokk
      name: GitHub

copyright: 著作权归作者 Jweokk 所有 · 免费阅读与非商业性分享 · 联系 weokk2025@gmail.com

nav:
  - 首页: index.md
