  - 第 1 章 AI 原生组织的崛起: 01-第1章-AI原生组织的崛起.md
  - 第 2 章 什么是 AI 原生组织: 02-第2章-什么是AI原生组织.md
  - 第 3 章 证据——实证研究怎么看: 03-第3章-证据-实证研究怎么看.md
  - 第 4 章 组织形态重构: 04-第4章-组织形态重构.md
  - 第 5 章 工作流与决策重构: 05-第5章-工作流与决策重构.md
  - 第 6 章 激励与人才: 06-第6章-激励与人才.md
  - 第 7 章 案例集: 07-第7章-案例集.md
  - 第 8 章 打造你的 AI 原生组织: 08-第8章-打造你的AI原生组织.md
  - 第 9 章 挑战、风险与未来: 09-第9章-挑战风险与未来.md
  - 第 10 章 行业篇——十个行业的 AI 原生转型: 10-第10章-行业篇.md
